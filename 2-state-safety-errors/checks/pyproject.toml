[project]
name = "log-triage-checks-2"
version = "0.2.0"
description = "Black-box checks for practice 2: they start your server and talk to it over MCP."
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastmcp==4.0.3",
    "jsonschema>=4.23",
    "pytest>=8.3",
    "pytest-asyncio>=1.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["."]
addopts = "-ra --tb=short"
